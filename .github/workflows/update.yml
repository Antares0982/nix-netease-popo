name: Update POPO

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-popo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update and build
        run: |
          nixpkgs_path=$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath')
          export NIX_PATH="nixpkgs=$nixpkgs_path"
          python3 update.py --self-test
          nix run "$nixpkgs_path#nix-update" -- --flake --use-update-script popo
          nix build .#popo --print-build-logs
          nix flake check --no-build
      - name: Commit update
        run: |
          if git diff --quiet -- source.json; then
            exit 0
          fi
          version=$(nix eval --raw .#popo.version)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source.json
          git commit -m "popo: update to $version"
          git push origin HEAD
